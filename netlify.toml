# netlify.toml
# ------------------------------------------------------------------
# 这个文件的作用：把 Netlify 的构建设置「写进代码仓库」，
# 而不是留在 Netlify 的网页后台里点来点去。
#
# 好处有三个：
#   1. 设置跟着代码走 —— 换电脑、换账号，配置不会丢
#   2. 看得见、能改、有历史 —— 改错了能回滚
#   3. 不用再担心「网页后台某个下拉框填错了」这类问题
#
# 注意：仓库里有这个文件时，它的优先级高于网页后台里的设置。
# 所以以后改构建设置，直接改这个文件，别再改网页后台。
# ------------------------------------------------------------------

[build]
  # 网站文件在仓库根目录（index.html 就在这一层）
  # 「.」表示当前目录，也就是仓库根目录
  publish = "."

  # 现在是纯静态 HTML，不需要构建，所以 build command 留空。
  # 什么时候要填？等你做完第 4 课换成 Astro，那时要改成：
  #   command = "npm run build"
  #   publish = "dist"
  # 这两行现在不能填，否则 Netlify 会去执行一个还不存在的构建命令，直接失败。

[build.environment]
  # Netlify 默认的 Node 版本比新工具要求的低，容易导致构建失败。
  # 这一行现在是「提前占位」的，不写也不影响现在的静态站；
  # 但第 4 课换成 Astro 后，没有它就一定会构建失败，所以干脆现在就写好。
  NODE_VERSION = "22"
