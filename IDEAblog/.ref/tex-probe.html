<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>tex stats</title></head>
<body>
<pre id="out">running…</pre>
<script>
const FILES = [
  'wall_texture.webp',
  'kawalekpodlogi.webp',
  'ceiling_texture.webp',
  'texturadoprogow.webp',
  'rysuneknaobraz1.webp',
];
(async () => {
  const out = [];
  for (const f of FILES) {
    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('load fail')); img.src = 'textures/corridor/' + f; });
      const c = document.createElement('canvas');
      const W = 40, H = 40;
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, W, H);
      const d = x.getImageData(0, 0, W, H).data;
      let r = 0, g = 0, b = 0, mn = 255, mx = 0;
      for (let i = 0; i < d.length; i += 4) {
        r += d[i]; g += d[i + 1]; b += d[i + 2];
        const l = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (l < mn) mn = l;
        if (l > mx) mx = l;
      }
      const n = d.length / 4;
      out.push({ f, size: img.naturalWidth + 'x' + img.naturalHeight, avg: [Math.round(r / n), Math.round(g / n), Math.round(b / n)], min: Math.round(mn), max: Math.round(mx) });
    } catch (e) { out.push({ f, err: e.message }); }
  }
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
})();
</script>
</body>
</html>
