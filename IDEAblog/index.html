<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一念未落 · 想法集</title>
  <meta name="description" content="未成之想，皆可入册。滚动下潜，进入一片水墨山海。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='9' fill='%23a8322d'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f4f1e8' font-family='KaiTi,serif'%3E念%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!--
    这里原本有一条 <link rel="preconnect" href="http://localhost:5173">，
    已删除。preconnect 是"提前和某个域名握手"的优化提示，指向一个
    本机开发服务器（5173）时，线上访问会白发一次请求再失败，
    控制台留一条干扰噪音，没有任何收益。
  -->
</head>
<body class="idea-page idea-scheme-dark idea-dive">

  <header class="idea-head idea-head--hero">
    <a class="idea-brand" href="index.html">一念未落</a>
    <nav class="idea-nav">
      <a href="index.html">首页</a>
      <a href="ideas.html">想法集</a>
      <a href="about.html">关于</a>
      <!-- 3D 长廊 = portfolio-3d 工程构建出来的单文件（自包含，双击可用）
           用相对路径，本地 file:// 双击和线上 Netlify 两边都能通 -->
      <a href="portfolio-3d/dist/index.html" target="_blank" rel="noopener">3D 长廊</a>
    </nav>
  </header>

  <main class="idea-hero idea-hero--dive">

    <!-- ======== 一念入海：assets/ink-world.js · Three.js 真 3D ========
         滚动 = 下潜（相机沿路径下降）
         鼠标 = 视角（第一人称 VR 式转头）
         点字 = 入册（鎏金标签字射线拾取跳页） ======== -->
    <canvas id="idea-gl" class="idea-gl" aria-hidden="true"></canvas>
    <div class="idea-vignette" aria-hidden="true"></div>

    <!-- ======== 竖排题字（下潜开始时淡出） ======== -->
    <div class="idea-titleblock">
      <div class="idea-subcol">
        <p class="idea-vsub">想法未必要成熟，<br>才配被写下来</p>
        <div class="idea-seal" aria-hidden="true">入畫</div>
      </div>
      <h1 class="idea-vtitle"><span>一</span><span>念</span><span>未</span><span>落</span></h1>
    </div>

    <!-- 操作提示 -->
    <div class="idea-hintline" aria-hidden="true">滚动即下潜 · 鼠标即视角 · 点字即入册</div>

    <!-- 下潜终点：入口面板 -->
    <div class="idea-dive-end" id="idea-dive-end">
      <a class="idea-dive-enter" href="portfolio-3d/dist/index.html" target="_blank" rel="noopener">落笔入册 · 请阁下入画</a>
      <span class="idea-dive-sub">一念未落 · 未成之想皆可入册</span>
    </div>

    <!-- WebGL 不可用时的静态降级封面 -->
    <div class="idea-webgl-fallback">
      <h1>一念未落</h1>
      <p>此设备暂不支持 3D 水墨场景，画已备好，直接入册。</p>
      <a href="portfolio-3d/dist/index.html" target="_blank" rel="noopener">请阁下入画 →</a>
    </div>

    <!-- 入画过渡：按钮点击后由墨滴、宣纸和游走笔锋组成短暂的开场。 -->
    <div class="ink-entry-transition" aria-hidden="true">
      <div class="ink-entry-transition__paper"></div>
      <div class="ink-entry-transition__wash ink-entry-transition__wash--one"></div>
      <div class="ink-entry-transition__wash ink-entry-transition__wash--two"></div>
      <div class="ink-entry-transition__brush"></div>
      <div class="ink-entry-transition__seal">入畫</div>
      <p class="ink-entry-transition__words">请阁下入画</p>
    </div>
  </main>

  <!-- 滚动轨道：提供下潜的滚动空间（约 3.4 屏） -->
  <div class="idea-track" aria-hidden="true"></div>

  <!-- Three.js UMD 传统脚本版：双击 file:// 打开也能跑 -->
  <script src="assets/vendor/three.min.js"></script>
  <script>window.IDEA_GL_STATUS = "loading";</script>
  <script src="assets/ink-world.js"></script>
  <script>
    (function () {
      var links = document.querySelectorAll('a[href="portfolio-3d/dist/index.html"]');
      var transition = document.querySelector('.ink-entry-transition');
      if (!transition) return;
      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          var target = link.href;
          var popup = link.target === '_blank' ? window.open('about:blank', '_blank') : null;
          document.body.classList.add('idea-entering-gallery');
          transition.classList.add('is-active');
          window.setTimeout(function () {
            if (popup) {
              popup.location.href = target;
            } else {
              window.location.href = target;
            }
          }, 1420);
        });
      });
    })();
  </script>
  <script>
    /*
     * 兜底只在确实无法运行时出现。此前这里只检查 IDEA_GL_READY，
     * 一旦主脚本有语法错误、网络加载慢或初始化超时，就会误报成
     * “此设备不支持 3D”。现在先区分 WebGL 不可用与页面脚本失败。
     */
    window.addEventListener("load", function () {
      setTimeout(function () {
        if (window.IDEA_GL_READY) return;
        var canvas = document.getElementById("idea-gl");
        var hasWebGL = false;
        try {
          hasWebGL = !!(canvas && (canvas.getContext("webgl2") || canvas.getContext("webgl")));
        } catch (e) {}
        var fallbackText = document.querySelector(".idea-webgl-fallback p");
        if (fallbackText) {
          fallbackText.textContent = hasWebGL
            ? "水墨场景加载没有完成，画已备好，仍可直接入画。"
            : "此设备暂不支持 3D 水墨场景，画已备好，直接入册。";
        }
        document.body.classList.add("idea-no-webgl");
      }, 8000);
    });
  </script>
</body>
</html>
